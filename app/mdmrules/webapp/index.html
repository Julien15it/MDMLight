<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDM Rules</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body > div,
      .sapUiComponentContainer,
      .sapUiComponentContainer > div,
      .sapUiComponentContainer > .sapUiView,
      .sapUiComponentContainer > div > .sapUiView {
        height: 100%;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-language="en"
      data-sap-ui-resourceroots='{"mdm.md.mdmrules.manage": "./"}'
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-frameOptions="trusted"
    ></script>
  </head>
  <body class="sapUiBody">
    <div
      data-sap-ui-component
      data-name="mdm.md.mdmrules.manage"
      data-id="container"
      data-settings='{"id" : "mdm.md.mdmrules.manage"}'
    ></div>
  </body>
</html>
