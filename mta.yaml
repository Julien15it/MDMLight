_schema-version: "3.2"
ID: mdm-md-businesspartner-manage
version: 1.66.0
description: "Manage Business Partner (F3163) - CAP + Fiori Elements"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --- CAP service (Node.js) ---------------------------------------------------
  - name: mdm-businesspartner-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: mdm-businesspartner-auth
      - name: mdm-businesspartner-destination-service
      - name: mdm-businesspartner-connectivity
      - name: mdm-businesspartner-aicore
      - name: mdmlight-bpa-key
      - name: mdmlight-bpa-uaa
      - name: mdm-businesspartner-db
    properties:
      # Non-reasoning primary: no hidden-reasoning budget, so no silent empty answer.
      AICORE_MODEL: anthropic--claude-4.5-haiku
      AICORE_FALLBACK_MODELS: gemini-3.5-flash,gpt-5-mini
      AICORE_RESOURCE_GROUP: default
      ASSISTANT_INTENT_SOURCE: model
      # The Work Zone site URL, used to build the approve/rework deep links sent to
      # SPA. Managed approuter, so there is no module to source it from - it is a
      # literal, and unset means approveUrl()/reworkUrl() return '' rather than a
      # dead link. Take it from Site Manager (the site's "Open" URL), including the
      # /site path and no trailing hash. APPROUTER_URL is NOT read any more: it was
      # left set on the deployed app and kept producing the removed standalone host.
      WORKZONE_URL: "https://alluvion-dev-cf.launchpad.cfapps.eu10.hana.ondemand.com/site?siteId=988d11c0-0c6c-42f2-840d-f8875105417b"
  

  # --- PostgreSQL schema deployer ----------------------------------------------
  # Runs cds-deploy as a one-off task; creates and evolves the staging tables.
  - name: mdm-businesspartner-db-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      disk-quota: 512M
      memory: 256M
      tasks:
        - name: deploy_to_postgresql
          command: npm start
          disk-quota: 512M
          memory: 256M
    requires:
      - name: mdm-businesspartner-db

  # The standalone approuter was removed 2026-08-13: the app is served by the
  # managed approuter through SAP Build Work Zone, standard edition. The routing
  # config is app/businesspartner/xs-app.json, which build:cf copies into dist/
  # and ships to the HTML5 repo alongside the app - that file, not a module here,
  # is what routes /service/* to mdm-businesspartner-srv-api.

  # --- UI: HTML5 application deployer ------------------------------------------
  # Both apps go through ONE content module, because two content modules aimed at
  # one app-host each replace the other's content. Work Zone standard edition
  # exposes only the FIRST crossNavigation inbound per app, so the MDM Rules tile
  # has to be its own app rather than a second inbound.
  #
  # The zipping is done by tools/package-html5.js, not left to mbt: an html5-type
  # module with `build-result: dist` produced a 22-byte empty resources zip on
  # 2026-08-17, which would have wiped both apps from the HTML5 repository.
  - name: mdm-businesspartner-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: mdm-businesspartner-repo-host
        parameters:
          content-target: true
    build-parameters:
      builder: custom
      # `install`, not `ci`. Reverted on 2026-08-24 after `ci` broke the build twice.
      #
      # The case for `ci` was real: all three package-lock.json files are tracked, and plain
      # `npm install` rewrites a lock whenever it can improve it, so every build left the tree
      # modified and the next `git pull` refused with "Your local changes would be overwritten".
      #
      # But `ci` refuses outright where a lock is missing, and a BAS workspace turned up without
      # app/mdmrules/package-lock.json - the file is on main and valid, so that is a working-copy
      # problem, but the build is where it lands. The guard written for it,
      # `npm ... ci || npm ... install`, never worked: the MTA build tool escapes the operator,
      # so the log reads `ci \|\| install` and the shell never sees an OR. It was a fallback in
      # appearance only, and it made the failure look like one that had already been handled.
      #
      # So: `install`, which runs whether or not a lock is there. The cost is a lock that may be
      # rewritten during a build. `ci` becomes the right choice again once every workspace
      # reliably carries the lockfiles - and then without a fallback, because there cannot be one.
      commands:
        - npm --prefix app/businesspartner install
        - npm --prefix app/businesspartner run build:cf
        - npm --prefix app/mdmrules install
        - npm --prefix app/mdmrules run build:cf
        - npm --prefix app/bptask install
        - npm --prefix app/bptask run build:cf
        - node tools/package-html5.js
      build-result: resources

  # --- Destination content -----------------------------------------------------
  - name: mdm-businesspartner-destination-content
    type: com.sap.application.content
    requires:
      - name: mdm-businesspartner-destination-service
        parameters:
          content-target: true
      - name: mdm-businesspartner-repo-host
        parameters:
          service-key:
            name: mdm-businesspartner-repo-host-key
      - name: mdm-businesspartner-auth
        parameters:
          service-key:
            name: mdm-businesspartner-auth-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: mdm_businesspartner_repo_host
              ServiceInstanceName: mdm-businesspartner-repo-host
              ServiceKeyName: mdm-businesspartner-repo-host-key
              sap.cloud.service: mdm.md.businesspartner
            - Authentication: OAuth2UserTokenExchange
              Name: mdm-businesspartner-srv-api
              TokenServiceInstanceName: mdm-businesspartner-auth
              TokenServiceKeyName: mdm-businesspartner-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: mdm.md.businesspartner
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: mdm-businesspartner-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: free
      config:
        engine_version: "16"

  - name: mdm-businesspartner-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: mdm-businesspartner-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**
  - name: mdm-businesspartner-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  # Kept although no module requires it any more: the managed approuter uses the
  # app-runtime plan to serve the app out of the HTML5 repo.
  - name: mdm-businesspartner-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: mdm-businesspartner-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
  - name: mdm-businesspartner-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: mdm-businesspartner-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
# --- SAP Build Process Automation API key (user-provided service) ------------
  - name: mdmlight-bpa-key
    type: org.cloudfoundry.existing-service
  - name: mdmlight-bpa-uaa
    type: org.cloudfoundry.existing-service