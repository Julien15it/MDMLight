_schema-version: "3.2"
ID: mdm-md-businesspartner-manage
version: 1.13.2
description: "Manage Business Partner (F3163) - CAP + Fiori Elements"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --- CAP service (Node.js) ---------------------------------------------------
  - name: mdm-businesspartner-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: mdm-businesspartner-auth
      - name: mdm-businesspartner-destination-service
      - name: mdm-businesspartner-connectivity
      - name: mdm-businesspartner-aicore
      - name: mdmlight-bpa-key
      - name: mdmlight-bpa-uaa
      - name: mdm-businesspartner-db
      - name: approuter-api
    properties:
      AICORE_MODEL: gpt-5
      AICORE_FALLBACK_MODELS: gpt-5-mini,anthropic--claude-4.5-haiku
      AICORE_RESOURCE_GROUP: default
      # The approuter's own public route, so change-request-service can build
      # the bpurl (deep link to the approve view) sent to the BPA workflow.
      APPROUTER_URL: ~{approuter-api/approuter-url}
  

  # --- PostgreSQL schema deployer ----------------------------------------------
  # Runs cds-deploy as a one-off task; creates and evolves the staging tables.
  - name: mdm-businesspartner-db-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      disk-quota: 512M
      memory: 256M
      tasks:
        - name: deploy_to_postgresql
          command: npm start
          disk-quota: 512M
          memory: 256M
    requires:
      - name: mdm-businesspartner-db

  # --- Standalone application router ------------------------------------------
  - name: mdm-businesspartner-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 256M
    build-parameters:
      builder: npm
    provides:
      - name: approuter-api
        properties:
          approuter-url: ${default-url}
    requires:
      - name: mdm-businesspartner-auth
      - name: mdm-businesspartner-repo-runtime
      - name: mdm-businesspartner-destination-service

  # --- UI: HTML5 application deployer ------------------------------------------
  - name: mdm-businesspartner-app-content
    type: com.sap.application.content
    path: app/businesspartner
    requires:
      - name: mdm-businesspartner-repo-host
        parameters:
          content-target: true
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - npm run package:cf
      build-result: resources

  # --- Destination content -----------------------------------------------------
  - name: mdm-businesspartner-destination-content
    type: com.sap.application.content
    requires:
      - name: mdm-businesspartner-destination-service
        parameters:
          content-target: true
      - name: mdm-businesspartner-repo-host
        parameters:
          service-key:
            name: mdm-businesspartner-repo-host-key
      - name: mdm-businesspartner-auth
        parameters:
          service-key:
            name: mdm-businesspartner-auth-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: mdm_businesspartner_repo_host
              ServiceInstanceName: mdm-businesspartner-repo-host
              ServiceKeyName: mdm-businesspartner-repo-host-key
              sap.cloud.service: mdm.md.businesspartner
            - Authentication: OAuth2UserTokenExchange
              Name: mdm-businesspartner-srv-api
              TokenServiceInstanceName: mdm-businesspartner-auth
              TokenServiceKeyName: mdm-businesspartner-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: mdm.md.businesspartner
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: mdm-businesspartner-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: free
      config:
        engine_version: "16"

  - name: mdm-businesspartner-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: mdm-businesspartner-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**
  - name: mdm-businesspartner-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: mdm-businesspartner-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: mdm-businesspartner-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
  - name: mdm-businesspartner-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: mdm-businesspartner-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
# --- SAP Build Process Automation API key (user-provided service) ------------
  - name: mdmlight-bpa-key
    type: org.cloudfoundry.existing-service
  - name: mdmlight-bpa-uaa
    type: org.cloudfoundry.existing-service