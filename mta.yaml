_schema-version: "3.2"
ID: mdm-md-businesspartner-manage
version: 1.16.0
description: "Manage Business Partner (F3163) - CAP + Fiori Elements"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --- CAP service (Node.js) ---------------------------------------------------
  - name: mdm-businesspartner-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: mdm-businesspartner-auth
      - name: mdm-businesspartner-destination-service
      - name: mdm-businesspartner-connectivity
      - name: mdm-businesspartner-aicore
      - name: mdmlight-bpa-key
      - name: mdmlight-bpa-uaa
      - name: mdm-businesspartner-db
    properties:
      # Non-reasoning primary: no hidden-reasoning budget, so no silent empty answer.
      AICORE_MODEL: anthropic--claude-4.5-haiku
      AICORE_FALLBACK_MODELS: gemini-3.5-flash,gpt-5-mini
      AICORE_RESOURCE_GROUP: default
      ASSISTANT_INTENT_SOURCE: model
      # APPROUTER_URL is deliberately unset: the standalone approuter is gone, so
      # there is no module to source it from and approveUrl() degrades to ''.
      # Set it to the Work Zone site URL as a literal to restore the deep link.
  

  # --- PostgreSQL schema deployer ----------------------------------------------
  # Runs cds-deploy as a one-off task; creates and evolves the staging tables.
  - name: mdm-businesspartner-db-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      disk-quota: 512M
      memory: 256M
      tasks:
        - name: deploy_to_postgresql
          command: npm start
          disk-quota: 512M
          memory: 256M
    requires:
      - name: mdm-businesspartner-db

  # The standalone approuter was removed 2026-08-13: the app is served by the
  # managed approuter through SAP Build Work Zone, standard edition. The routing
  # config is app/businesspartner/xs-app.json, which build:cf copies into dist/
  # and ships to the HTML5 repo alongside the app - that file, not a module here,
  # is what routes /service/* to mdm-businesspartner-srv-api.

  # --- UI: HTML5 application deployer ------------------------------------------
  # One content module funnels both app zips into the same app-host. Two content
  # modules targeting one app-host would each replace the other's content.
  - name: mdm-businesspartner-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: mdm-businesspartner-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - businesspartner-ui.zip
          name: businesspartner-ui
          target-path: resources/
        - artifacts:
            - mdmrules-ui.zip
          name: mdmrules-ui
          target-path: resources/

  # Work Zone standard edition exposes only the FIRST crossNavigation inbound per
  # app, so a second tile needs a second app - not a second inbound.
  - name: businesspartner-ui
    type: html5
    path: app/businesspartner
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: mdmrules-ui
    type: html5
    path: app/mdmrules
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # --- Destination content -----------------------------------------------------
  - name: mdm-businesspartner-destination-content
    type: com.sap.application.content
    requires:
      - name: mdm-businesspartner-destination-service
        parameters:
          content-target: true
      - name: mdm-businesspartner-repo-host
        parameters:
          service-key:
            name: mdm-businesspartner-repo-host-key
      - name: mdm-businesspartner-auth
        parameters:
          service-key:
            name: mdm-businesspartner-auth-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: mdm_businesspartner_repo_host
              ServiceInstanceName: mdm-businesspartner-repo-host
              ServiceKeyName: mdm-businesspartner-repo-host-key
              sap.cloud.service: mdm.md.businesspartner
            - Authentication: OAuth2UserTokenExchange
              Name: mdm-businesspartner-srv-api
              TokenServiceInstanceName: mdm-businesspartner-auth
              TokenServiceKeyName: mdm-businesspartner-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: mdm.md.businesspartner
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: mdm-businesspartner-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: free
      config:
        engine_version: "16"

  - name: mdm-businesspartner-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: mdm-businesspartner-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**
  - name: mdm-businesspartner-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  # Kept although no module requires it any more: the managed approuter uses the
  # app-runtime plan to serve the app out of the HTML5 repo.
  - name: mdm-businesspartner-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: mdm-businesspartner-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
  - name: mdm-businesspartner-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: mdm-businesspartner-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
# --- SAP Build Process Automation API key (user-provided service) ------------
  - name: mdmlight-bpa-key
    type: org.cloudfoundry.existing-service
  - name: mdmlight-bpa-uaa
    type: org.cloudfoundry.existing-service