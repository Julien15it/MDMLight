_schema-version: "3.2"
ID: mdm-md-businesspartner-manage
version: 1.0.0
description: "Manage Business Partner (F3163) - CAP + Fiori Elements"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --- CAP service (Node.js) ---------------------------------------------------
  - name: mdm-businesspartner-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: mdm-businesspartner-db
      - name: mdm-businesspartner-auth

  # --- HANA deployer -----------------------------------------------------------
  - name: mdm-businesspartner-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: mdm-businesspartner-db

  # --- UI: HTML5 application deployer ------------------------------------------
  - name: mdm-businesspartner-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: mdm-businesspartner-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - mdmmdbusinesspartnermanage.zip
          name: mdmmdbusinesspartnermanage
          target-path: resources/

  - name: mdmmdbusinesspartnermanage
    type: html5
    path: app/businesspartner
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # --- App router --------------------------------------------------------------
  - name: mdm-businesspartner-destination-content
    type: com.sap.application.content
    requires:
      - name: mdm-businesspartner-destination-service
        parameters:
          content-target: true
      - name: mdm-businesspartner-repo-host
        parameters:
          service-key:
            name: mdm-businesspartner-repo-host-key
      - name: mdm-businesspartner-auth
        parameters:
          service-key:
            name: mdm-businesspartner-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: mdm_businesspartner_repo_host
              ServiceInstanceName: mdm-businesspartner-repo-host
              ServiceKeyName: mdm-businesspartner-repo-host-key
              sap.cloud.service: mdm.md.businesspartner
            - Authentication: OAuth2UserTokenExchange
              Name: mdm-businesspartner-srv-api
              TokenServiceInstanceName: mdm-businesspartner-auth
              TokenServiceKeyName: mdm-businesspartner-auth-key
              sap.cloud.service: mdm.md.businesspartner
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: mdm-businesspartner-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: mdm-businesspartner-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: mdm-businesspartner-${org}-${space}
        tenant-mode: dedicated
  - name: mdm-businesspartner-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: mdm-businesspartner-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
